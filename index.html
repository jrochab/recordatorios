<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis recordatorios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --ink:#13302A; --muted:#566B64; --line:#D3DED8;
  --cumple:#C92A63; --cita:#2B59E6; --otro:#12795D; --on-cat:#FFFFFF;
  --primary:#13302A; --on-primary:#FFFFFF; --danger:#B3261E; --scrim:rgba(10,25,21,.45);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --text:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C19; --surface:#172824; --ink:#E6F0EC; --muted:#93A8A1; --line:#27403A;
    --cumple:#FF7AA6; --cita:#8FA9FF; --otro:#4FD1A5; --on-cat:#0F1C19;
    --primary:#E6F0EC; --on-primary:#0F1C19; --danger:#FF8A80; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C19; --surface:#172824; --ink:#E6F0EC; --muted:#93A8A1; --line:#27403A;
  --cumple:#FF7AA6; --cita:#8FA9FF; --otro:#4FD1A5; --on-cat:#0F1C19;
  --primary:#E6F0EC; --on-primary:#0F1C19; --danger:#FF8A80; --scrim:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cita);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:28px 18px 120px}
header h1{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.today{margin:0;color:var(--muted)}
.today strong{color:var(--ink);font-weight:600}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px;align-items:center}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:500;font-size:.9rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.ghost{margin-left:auto;border-style:dashed}
.chip.ghost[aria-pressed="true"]{background:transparent;color:var(--ink);border-color:var(--ink);border-style:solid}

.group h2{font-family:var(--display);font-size:1.05rem;font-weight:600;margin:26px 0 10px;color:var(--muted);letter-spacing:.01em}
.card{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card.is-hidden{opacity:.6;border-style:dashed}
.card.is-past .body h3{color:var(--muted)}
.tab{flex:none;width:58px;align-self:flex-start;border-radius:10px;overflow:hidden;text-align:center;background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,var(--surface))}
.tab-m{display:block;background:var(--c);color:var(--on-cat);font-size:.78rem;font-weight:600;padding:2px 0;letter-spacing:.04em}
.tab-d{display:block;font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.25;color:var(--ink)}
.body{flex:1;min-width:0}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.body h3{margin:0;font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.rel{flex:none;font-size:.8rem;font-weight:600;border-radius:999px;padding:2px 10px;border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--surface));color:var(--ink);white-space:nowrap}
.rel.now{background:var(--c);color:var(--on-cat);border-color:var(--c)}
.meta{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.note{margin:8px 0 0;font-size:.92rem;overflow-wrap:anywhere}
.acts{display:flex;gap:4px;margin:8px -6px -4px;flex-wrap:wrap}
.acts button{background:none;border:0;padding:6px 8px;border-radius:8px;font-size:.88rem;font-weight:500;color:var(--muted)}
.acts button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.acts button.del:hover{color:var(--danger)}

.empty{text-align:center;padding:48px 12px;color:var(--muted)}
.empty p{margin:0 0 16px}

.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--on-primary);border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:1rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.foot{margin-top:30px;font-size:.82rem;color:var(--muted);text-align:center}

.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.overlay[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--display);font-size:1.4rem;margin:0 0 14px}
.sheet label,.sheet legend{display:block;font-size:.88rem;font-weight:600;margin:0 0 12px}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=time],.sheet textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;font-size:1rem;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;font-weight:400;min-height:44px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:0;padding:0;margin:0 0 4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{margin:0;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px;border:1.5px solid var(--line);border-radius:10px;font-weight:500;font-size:.9rem}
.seg span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.seg input:checked + span{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.seg input:focus-visible + span{outline:3px solid var(--cita);outline-offset:2px}
.sheet .check{display:flex;align-items:center;gap:10px;font-weight:500;margin:14px 0}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:12px;border-radius:12px;font-weight:600;border:1.5px solid var(--line);background:transparent}
.btn.main{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:.92rem;z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mis recordatorios</h1>
    <p class="today" id="today"></p>
  </header>

  <div class="tools" id="tools">
    <button class="chip" data-cat="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-cat="cumple" aria-pressed="false">Cumpleaños</button>
    <button class="chip" data-cat="cita" aria-pressed="false">Citas</button>
    <button class="chip" data-cat="otro" aria-pressed="false">Otros</button>
    <button class="chip ghost" id="toggle-hidden" aria-pressed="false">Ver ocultos</button>
  </div>

  <main id="list"></main>
  <p class="foot" id="foot"></p>
</div>

<button class="fab" id="add">+ Agregar evento</button>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>
    <h2 id="sheet-title">Nuevo evento</h2>
    <label>Título
      <input type="text" id="f-title" maxlength="80" placeholder="Ej. Cumpleaños de Ana" autocomplete="off">
    </label>
    <div class="row">
      <label>Fecha
        <input type="date" id="f-date">
      </label>
      <label>Hora (opcional)
        <input type="time" id="f-time">
      </label>
    </div>
    <fieldset class="seg">
      <legend>Tipo</legend>
      <label style="--c:var(--cumple)"><input type="radio" name="cat" value="cumple"><span>Cumpleaños</span></label>
      <label style="--c:var(--cita)"><input type="radio" name="cat" value="cita"><span>Cita</span></label>
      <label style="--c:var(--otro)"><input type="radio" name="cat" value="otro"><span>Otro</span></label>
    </fieldset>
    <label class="check"><input type="checkbox" id="f-yearly"> Repetir cada año</label>
    <label>Nota (opcional)
      <textarea id="f-note" rows="2" maxlength="300" placeholder="Dirección, regalo, qué llevar…"></textarea>
    </label>
    <p id="f-error" style="color:var(--danger);margin:0 0 10px;font-size:.9rem" hidden></p>
    <div class="btns">
      <button type="button" class="btn" id="cancel">Cancelar</button>
      <button type="submit" class="btn main">Guardar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button id="toast-undo">Deshacer</button></div>

<script>
(function(){
  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
  var DIAS_L=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var CAT_LABEL={cumple:'Cumpleaños',cita:'Cita',otro:'Otro'};
  var KEY='recordatorios:v1';
  var DAY=86400000;

  var state={events:[]};
  var filter='todos', showHidden=false, editingId=null, mode='local';
  var db=null, uid=null, saving=Promise.resolve();
  var undoFn=null, toastTimer=null;

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function uidNew(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function pad(n){return n<10?'0'+n:''+n}

  /* ---------- fechas ---------- */
  function todayUTC(){var n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())}
  function todayStr(){var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())}
  function parse(s){var a=s.split('-').map(Number);return {y:a[0],m:a[1],d:a[2]}}
  function leap(y){return (y%4===0&&y%100!==0)||y%400===0}
  function mk(y,p){var d=p.d;if(p.m===2&&d===29&&!leap(y))d=28;return Date.UTC(y,p.m-1,d)}
  function occurrence(ev,today){
    var p=parse(ev.date);
    if(!ev.yearly)return Date.UTC(p.y,p.m-1,p.d);
    var ty=new Date(today).getUTCFullYear();
    var t=mk(ty,p);
    if(t<today)t=mk(ty+1,p);
    return t;
  }
  function relLabel(n){
    if(n===0)return 'Hoy';
    if(n===1)return 'Mañana';
    if(n===-1)return 'Ayer';
    if(n>1){
      if(n<=60)return 'En '+n+' días';
      return 'En '+Math.round(n/30)+' meses';
    }
    if(n>=-60)return 'Hace '+(-n)+' días';
    return 'Hace '+Math.round(-n/30)+' meses';
  }
  function groupOf(n){
    if(n<0)return 4;
    if(n===0)return 0;
    if(n<=7)return 1;
    if(n<=30)return 2;
    return 3;
  }
  var GROUP_TITLES=['Hoy','Esta semana','Próximos 30 días','Más adelante','Pasados'];

  /* ---------- guardado ---------- */
  function loadLocal(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
  function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function persist(){
    saveLocal();
    if(db&&uid){
      var snapshot=JSON.parse(JSON.stringify(state.events));
      saving=saving.then(function(){return db.doc('data/users/'+uid+'/agenda').set({events:snapshot})}).catch(function(e){console.error('db',e)});
    }
  }
  function setFoot(){
    $('foot').textContent = mode==='cuenta'
      ? 'Tus eventos se guardan en tu cuenta y los verás en cualquier dispositivo.'
      : 'Tus eventos se guardan solo en este navegador.';
  }

  /* ---------- render ---------- */
  function render(){
    var now=new Date();
    var t=todayUTC();
    $('today').innerHTML=DIAS_L[now.getDay()]+' '+now.getDate()+' de '+MESES_L[now.getMonth()];

    var hiddenCount=state.events.filter(function(e){return e.hidden}).length;
    var btn=$('toggle-hidden');
    btn.textContent=(showHidden?'Ocultar los ocultos':'Ver ocultos')+(hiddenCount?' ('+hiddenCount+')':'');
    btn.setAttribute('aria-pressed',showHidden?'true':'false');
    btn.style.display=(hiddenCount||showHidden)?'':'none';

    var items=state.events.filter(function(e){
      if(e.hidden&&!showHidden)return false;
      if(filter!=='todos'&&e.cat!==filter)return false;
      return true;
    }).map(function(e){
      var occ=occurrence(e,t);
      return {e:e,occ:occ,diff:Math.round((occ-t)/DAY)};
    });

    var todayCount=items.filter(function(i){return i.diff===0&&!i.e.hidden}).length;
    if(todayCount){
      $('today').innerHTML+=' · <strong>'+(todayCount===1?'1 evento hoy':todayCount+' eventos hoy')+'</strong>';
    }

    var groups=[[],[],[],[],[]];
    items.forEach(function(i){groups[groupOf(i.diff)].push(i)});
    for(var g=0;g<5;g++){
      groups[g].sort(function(a,b){
        if(a.occ!==b.occ)return g===4?b.occ-a.occ:a.occ-b.occ;
        return (a.e.time||'').localeCompare(b.e.time||'');
      });
    }

    var html='';
    groups.forEach(function(list,g){
      if(!list.length)return;
      html+='<section class="group"><h2>'+GROUP_TITLES[g]+'</h2>'+list.map(cardHTML).join('')+'</section>';
    });

    if(!html){
      var msg;
      if(!state.events.length)msg='Aún no tienes eventos. Agrega cumpleaños, citas o lo que no quieras olvidar.';
      else if(!showHidden&&hiddenCount&&filter==='todos')msg='Todos tus eventos están ocultos.';
      else msg='No hay eventos en esta vista.';
      html='<div class="empty"><p>'+msg+'</p><button class="btn main" id="empty-add" style="flex:none;padding:12px 22px">Agregar evento</button></div>';
    }
    $('list').innerHTML=html;
  }

  function cardHTML(i){
    var e=i.e, d=new Date(i.occ);
    var meta=[DIAS[d.getUTCDay()]];
    if(!e.yearly&&d.getUTCFullYear()!==new Date().getFullYear())meta[0]+=' '+d.getUTCFullYear();
    if(e.time)meta.push(e.time);
    meta.push(CAT_LABEL[e.cat]||'Otro');
    if(e.yearly)meta.push('Cada año');
    if(e.hidden)meta.push('Oculto');
    var cls='card'+(e.hidden?' is-hidden':'')+(i.diff<0?' is-past':'');
    return '<article class="'+cls+'" style="--c:var(--'+(CAT_LABEL[e.cat]?e.cat:'otro')+')">'+
      '<div class="tab"><span class="tab-m">'+MESES[d.getUTCMonth()]+'</span><span class="tab-d">'+d.getUTCDate()+'</span></div>'+
      '<div class="body">'+
        '<div class="top"><h3>'+esc(e.title)+'</h3><span class="rel'+(i.diff===0?' now':'')+'">'+relLabel(i.diff)+'</span></div>'+
        '<p class="meta">'+esc(meta.join(' · '))+'</p>'+
        (e.note?'<p class="note">'+esc(e.note)+'</p>':'')+
        '<div class="acts">'+
          '<button data-act="edit" data-id="'+e.id+'">Editar</button>'+
          '<button data-act="hide" data-id="'+e.id+'">'+(e.hidden?'Mostrar':'Ocultar')+'</button>'+
          '<button class="del" data-act="del" data-id="'+e.id+'">Eliminar</button>'+
        '</div>'+
      '</div></article>';
  }

  /* ---------- acciones ---------- */
  function find(id){for(var i=0;i<state.events.length;i++)if(state.events[i].id===id)return i;return -1}
  function toast(msg,undo){
    $('toast-msg').textContent=msg;
    undoFn=undo||null;
    $('toast-undo').style.display=undo?'':'none';
    $('toast').hidden=false;
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){$('toast').hidden=true;undoFn=null},6000);
  }
  $('toast-undo').addEventListener('click',function(){
    if(undoFn)undoFn();
    undoFn=null;$('toast').hidden=true;
  });

  $('list').addEventListener('click',function(ev){
    var b=ev.target.closest('button');
    if(!b)return;
    if(b.id==='empty-add'){openSheet();return}
    var id=b.getAttribute('data-id'),act=b.getAttribute('data-act');
    var idx=find(id);
    if(idx<0)return;
    var e=state.events[idx];
    if(act==='edit'){openSheet(e)}
    else if(act==='hide'){
      e.hidden=!e.hidden;
      persist();render();
      toast(e.hidden?'Evento oculto. Usa «Ver ocultos» para mostrarlo.':'Evento visible de nuevo',function(){
        e.hidden=!e.hidden;persist();render();
      });
    }
    else if(act==='del'){
      var removed=state.events.splice(idx,1)[0];
      persist();render();
      toast('Evento eliminado',function(){
        state.events.splice(Math.min(idx,state.events.length),0,removed);
        persist();render();
      });
    }
  });

  $('tools').addEventListener('click',function(ev){
    var b=ev.target.closest('button');
    if(!b)return;
    if(b.id==='toggle-hidden'){showHidden=!showHidden;render();return}
    var c=b.getAttribute('data-cat');
    if(!c)return;
    filter=c;
    var chips=$('tools').querySelectorAll('.chip[data-cat]');
    for(var i=0;i<chips.length;i++)chips[i].setAttribute('aria-pressed',chips[i].getAttribute('data-cat')===c?'true':'false');
    render();
  });

  /* ---------- formulario ---------- */
  function setCat(c){
    var r=document.querySelectorAll('input[name=cat]');
    for(var i=0;i<r.length;i++)r[i].checked=(r[i].value===c);
  }
  function getCat(){
    var r=document.querySelector('input[name=cat]:checked');
    return r?r.value:'otro';
  }
  function openSheet(e){
    editingId=e?e.id:null;
    $('sheet-title').textContent=e?'Editar evento':'Nuevo evento';
    $('f-title').value=e?e.title:'';
    $('f-date').value=e?e.date:todayStr();
    $('f-time').value=e?(e.time||''):'';
    $('f-note').value=e?(e.note||''):'';
    setCat(e?e.cat:'cumple');
    $('f-yearly').checked=e?!!e.yearly:true;
    $('f-error').hidden=true;
    $('overlay').hidden=false;
    setTimeout(function(){$('f-title').focus()},30);
  }
  function closeSheet(){$('overlay').hidden=true;editingId=null}

  // Sugerir "cada año" según el tipo, solo al crear
  document.querySelectorAll('input[name=cat]').forEach(function(r){
    r.addEventListener('change',function(){
      if(editingId===null)$('f-yearly').checked=(getCat()==='cumple');
    });
  });

  $('add').addEventListener('click',function(){openSheet()});
  $('cancel').addEventListener('click',closeSheet);
  $('overlay').addEventListener('click',function(ev){if(ev.target===$('overlay'))closeSheet()});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('overlay').hidden)closeSheet()});

  $('form').addEventListener('submit',function(ev){
    ev.preventDefault();
    var title=$('f-title').value.trim(), date=$('f-date').value;
    var err=$('f-error');
    if(!title){err.textContent='Escribe un título para el evento.';err.hidden=false;$('f-title').focus();return}
    if(!date){err.textContent='Elige una fecha.';err.hidden=false;$('f-date').focus();return}
    var data={title:title,date:date,time:$('f-time').value,cat:getCat(),yearly:$('f-yearly').checked,note:$('f-note').value.trim()};
    if(editingId){
      var i=find(editingId);
      if(i>=0){for(var k in data)state.events[i][k]=data[k]}
    }else{
      data.id=uidNew();data.hidden=false;
      state.events.push(data);
    }
    persist();closeSheet();render();
  });

  /* ---------- inicio ---------- */
  var local=loadLocal();
  if(local&&Array.isArray(local.events))state.events=local.events;
  setFoot();render();

  (async function(){
    try{
      if(!window.claude||!window.claude.use)return;
      var res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!res[0]||!res[1])return;
      var id=await res[1].id();
      if(!id)return;
      db=res[0];uid=id;
      var snap=await db.doc('data/users/'+uid+'/agenda').get();
      mode='cuenta';
      if(snap.exists&&snap.data()&&Array.isArray(snap.data().events)){
        state.events=snap.data().events;
        saveLocal();
      }else if(state.events.length){
        persist();
      }
      setFoot();render();
    }catch(e){console.error(e)}
  })();
})();
</script>
</body>
</html>
